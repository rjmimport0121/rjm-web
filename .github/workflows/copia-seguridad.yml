# Copia de seguridad semanal de la base de datos de Supabase (gratis en GitHub).
#
# El plan gratis de Supabase no da copias descargables. Este flujo hace una
# cada domingo (y cuando lo lances a mano desde la pestaña Actions), la cifra
# con tu clave y la guarda 90 días como "artifact" del flujo.
#
# El repositorio es público: por eso la copia SIEMPRE va cifrada. Sin la clave
# CLAVE_COPIAS nadie puede leerla, ni tú: guárdala en un lugar seguro.
#
# Necesita dos secretos en GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_DB_URL  Cadena de conexión "Session pooler" de Supabase (botón
#                    Connect del proyecto), con la contraseña de la base de datos.
#   CLAVE_COPIAS     Una frase larga que inventes tú (mínimo 20 caracteres).
#
# Para restaurar, ver docs/COPIAS.md.
name: Copia de seguridad

on:
  schedule:
    - cron: '17 8 * * 0'   # domingos 08:17 UTC = 03:17 en Lima
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Revisar que los secretos existan
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.CLAVE_COPIAS }}
        run: |
          if [ -z "$DB" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_URL o CLAVE_COPIAS (ver docs/COPIAS.md)."
            exit 1
          fi
          if [ ${#CLAVE} -lt 20 ]; then
            echo "::error::CLAVE_COPIAS debe tener al menos 20 caracteres."
            exit 1
          fi

      - name: Instalar pg_dump 17 (misma versión que Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Copiar y cifrar
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.CLAVE_COPIAS }}
        run: |
          set -euo pipefail
          umask 077
          FECHA=$(TZ=America/Lima date +%Y-%m-%d)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          # Tus tablas (public), las cuentas de usuario (auth) y la lista de archivos (storage).
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --schema=auth --schema=storage \
            --no-owner --no-privileges --format=custom --file=copia.dump
          test -s copia.dump
          printf '%s' "$CLAVE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "rjm-copia-$FECHA.dump.gpg" copia.dump
          rm -f copia.dump
          ls -l "rjm-copia-$FECHA.dump.gpg"

      - name: Guardar la copia cifrada (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: rjm-copia-${{ env.FECHA }}
          path: rjm-copia-${{ env.FECHA }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
