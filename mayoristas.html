<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Portal mayorista | RJM Import-Export</title>
<link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="css/fuentes.css"/>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"/>
<link rel="stylesheet" href="css/panel.css"/>
<style>
  .tramos-txt{font-size:.8rem;line-height:1.7;white-space:nowrap}
  .tramos-txt b{color:var(--white);font-weight:500}
  .cant{width:90px;text-align:right}
  .resumen{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--border);padding:1rem;margin-top:1rem;
    display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
  .resumen .total{font-family:var(--display);font-size:1.2rem;color:var(--white)}
  /* Celular: cada producto como tarjeta (sin deslizar de lado) */
  @media(max-width:700px){
    #vistaLista .tabla-wrap{overflow:visible;border:none;background:none}
    #vistaLista table,#vistaLista tbody{display:block}
    #vistaLista thead{display:none}
    #tbLista tr{display:grid;grid-template-columns:1fr auto;gap:.35rem .8rem;background:var(--panel);
      border:1px solid var(--border);border-radius:16px;padding:1rem;margin-bottom:.8rem}
    #tbLista td{display:block;padding:0;border:none;text-align:left}
    #tbLista td:nth-child(1){grid-column:1;font-family:var(--mono);font-size:.7rem;color:var(--cyan)}
    #tbLista td:nth-child(3){grid-column:2;grid-row:1;text-align:right;font-size:.8rem}
    #tbLista td:nth-child(2){grid-column:1 / -1;font-size:1rem}
    #tbLista td:nth-child(4){grid-column:1 / -1;white-space:normal;padding:.5rem .7rem;border-radius:10px;background:rgba(251,146,60,.06)}
    #tbLista td:nth-child(5){grid-column:1;align-self:center}
    #tbLista td:nth-child(6){grid-column:2;align-self:center;text-align:right;font-family:var(--display);font-size:1.05rem;color:var(--white)}
    #tbLista td:nth-child(5)::before{content:'Cantidad';display:block;font-size:.7rem;color:var(--text);margin-bottom:.2rem}
    #tbLista .cant{width:120px;min-height:48px;font-size:1.1rem;text-align:center}
    #tbLista td[colspan]{grid-column:1 / -1}
    .resumen{border-radius:16px 16px 0 0;margin-inline:-1rem}
    .resumen .btn{width:100%}
    #vistaLista .barra{flex-direction:column;align-items:stretch}
    #vistaLista .barra input{width:100%;max-width:none;min-height:48px}
  }
</style>
</head>
<body>

<header class="top">
  <a class="marca" href="index.html"><img src="img/logo-192.png" alt="RJM" width="52" height="52"/><span>RJM <small>Portal mayorista</small></span></a>
  <div class="acciones">
    <span id="quien"></span>
    <button class="btn sec chico oculto" id="btnSalir">Cerrar sesión</button>
  </div>
</header>

<main id="vistaLogin" class="wrap">
  <div class="card login">
    <h1>Portal mayorista</h1>
    <p class="sub">Ingresa con el usuario y la contraseña que te entregó RJM.</p>
    <div id="loginMsg"></div>
    <form id="formLogin">
      <div class="campo"><label for="lUsuario">Usuario</label><input id="lUsuario" autocomplete="username" autocapitalize="none" required/></div>
      <div class="campo"><label for="lClave">Contraseña</label><input id="lClave" type="password" autocomplete="current-password" required/></div>
      <button class="btn full" id="btnEntrar">Ingresar</button>
    </form>
    <p class="sub" style="margin:1.2rem 0 0;font-size:.8rem">¿Quieres ser distribuidor? <a id="linkWa" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>
  </div>
</main>

<main id="vistaLista" class="wrap oculto">
  <h1>Lista de precios mayoristas</h1>
  <p class="sub" id="saludo"></p>
  <div id="listaMsg"></div>
  <div class="barra">
    <input type="search" id="buscar" placeholder="Buscar por nombre, código o categoría…"/>
    <small id="actualizado"></small>
  </div>
  <div class="tabla-wrap"><table>
    <thead><tr><th>Código</th><th>Producto</th><th class="num">Stock</th><th>Precio unitario según cantidad (inc. IGV)</th><th class="num">Cantidad</th><th class="num">Subtotal</th></tr></thead>
    <tbody id="tbLista"><tr><td colspan="6">Cargando…</td></tr></tbody>
  </table></div>
  <div class="resumen">
    <div><small>Total estimado</small><div class="total" id="total">S/ 0.00</div><small id="notaIgv"></small></div>
    <div class="acciones-fila">
      <button class="btn sec" id="btnPdf" disabled>📄 Proforma en PDF</button>
      <button class="btn" id="btnPedido" disabled>Enviar proforma por WhatsApp</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/comun.js"></script>
<script src="js/mayoristas.js"></script>
</body>
</html>
